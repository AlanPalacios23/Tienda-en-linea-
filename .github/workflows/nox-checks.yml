name: NOX | Validación
on:
  push:
    branches: [main, "feat/nox-*"]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxis JavaScript
        run: |
          node --check store-core.js
          node --check catalog.js
          node --check scrip.js
      - name: Pruebas de catálogo y carrito
        run: node --test tests/*.test.cjs
      - name: Verificar archivos requeridos
        run: |
          test -s index.html
          test -s style.css
          grep -q 'NOX' index.html

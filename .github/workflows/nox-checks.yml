name: NOX | Validación
on:
  push:
    branches: [main, "feat/nox-*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nox
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: nox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nox -d nox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://nox:test_only_password@localhost:5432/nox
      PUBLIC_BASE_URL: http://localhost:8080
      CHECKOUT_ENABLED: false
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias del API
        run: npm --prefix server install --no-audit --no-fund
      - name: Validar sintaxis
        run: |
          node --check scrip.js
          node --check success.js
          node --check server/index.js
          node --check server/inventory.js
          node --check server/config.js
          node --check server/reconcile.js
      - name: Migrar y verificar inventario inicial
        run: npm --prefix server run migrate
      - name: Pruebas de UI y contrato
        run: node --test tests/*.test.cjs
      - name: Pruebas de Stripe y stock concurrente en PostgreSQL
        run: npm --prefix server test
      - name: HTTP smoke test, catálogo y rutas privadas
        run: |
          node server/index.js > /tmp/nox-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/api/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/api/catalog | node -e '
            let body="";
            process.stdin.on("data",x=>body+=x);
            process.stdin.on("end",()=>{
              const c=JSON.parse(body);
              if(c.products.length!==6 || c.checkout_enabled!==false)process.exit(1);
              for(const p of c.products){
                if(p.variants.length!==2)process.exit(1);
              }
            });'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/checkout -H 'Content-Type: application/json' -d '{}')" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/server/.env.example)" = "404"
          curl -fsS http://localhost:8080/success.js >/dev/null
